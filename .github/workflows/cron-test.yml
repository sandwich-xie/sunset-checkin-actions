name: Cron 连通性测试

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 发送测试消息
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python3 -c "
          import os, urllib.request, urllib.parse
          from datetime import datetime, timezone, timedelta
          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz).strftime('%H:%M:%S')
          content = f'这是一条cron测试消息，执行于 {now}'
          print(content)
          key = os.environ['SERVERCHAN_SENDKEY']
          body = urllib.parse.urlencode({'title': 'Cron 测试', 'desp': content}).encode()
          req = urllib.request.Request(f'https://sctapi.ftqq.com/{key}.send', data=body,
              headers={'Content-Type':'application/x-www-form-urlencoded'}, method='POST')
          resp = urllib.request.urlopen(req, timeout=15).read().decode()
          print(f'[PUSH] {resp[:120]}')
          "
