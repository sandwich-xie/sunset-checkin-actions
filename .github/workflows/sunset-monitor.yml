name: 火烧云监控

on:
  schedule:
    # GitHub 内置 cron 仅作兜底（不可靠），主要依赖 cron-job.org 外部触发
    - cron: "0 1,3,6,9,13 * * *"   # CST 09:00/11:00/14:00/17:00/21:00
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 火烧云监控
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SUNSET_CITIES: ${{ vars.SUNSET_CITIES || '长沙,衡阳' }}
          SUNSET_THRESHOLD: ${{ vars.SUNSET_THRESHOLD || '0.33' }}
          SUNSET_MODELS: ${{ vars.SUNSET_MODELS || 'GFS,EC' }}
        run: python sunset_monitor.py
