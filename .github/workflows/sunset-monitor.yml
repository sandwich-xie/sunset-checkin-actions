name: 火烧云监控

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 火烧云监控
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SUNSET_CITIES: ${{ vars.SUNSET_CITIES || '长沙,衡阳' }}
          SUNSET_THRESHOLD: ${{ vars.SUNSET_THRESHOLD || '0.33' }}
          SUNSET_MODELS: ${{ vars.SUNSET_MODELS || 'GFS,EC' }}
        run: python scripts/sunset_monitor.py
