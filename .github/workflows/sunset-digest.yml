name: 火烧云日报

on:
  schedule:
    - cron: "0 2 * * *"          # 10:00 CST = 02:00 UTC
    - cron: "0 7 * * *"          # 15:00 CST = 07:00 UTC
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 火烧云日报
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SUNSET_CITIES: ${{ vars.SUNSET_CITIES || '长沙,衡阳' }}
        run: python sunset_monitor.py --digest
